<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/css/style.css?v=1" />
    <link rel="stylesheet" href="/static/css/krds.css?v=1" />
</head>
<body class="auth-body">
    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-brand"><span class="brand-institution">한국전력공사</span>정보공개 <span>청구지원</span></div>
            <h1>계정 생성</h1>
            <p>최초 실행 보안을 위해 아이디와 비밀번호를 먼저 생성합니다.</p>
            {% if error %}
            <div class="auth-error" role="alert">{{ error }}</div>
            {% endif %}
            <form method="post" action="/setup" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}" />
                <label>
                    아이디
                    <input type="text" name="username" value="{{ username or '' }}" autocomplete="username" required minlength="3" autofocus />
                </label>
                <label>
                    비밀번호
                    <input type="password" name="password" autocomplete="new-password" required minlength="8" />
                </label>
                <label>
                    비밀번호 확인
                    <input type="password" name="password_confirm" autocomplete="new-password" required minlength="8" />
                </label>
                <button type="submit" class="btn-primary">계정 생성</button>
            </form>
            <div class="auth-note">계정 정보는 로컬 DB에 해시로 저장되며, 이후 실행부터 로그인 후 사용할 수 있습니다.</div>
        </section>
        <div class="auth-note" style="text-align:center;margin-top:18px">© 2026 한국전력공사</div>
    </main>
</body>
</html>
